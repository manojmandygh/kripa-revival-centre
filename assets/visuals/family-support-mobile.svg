<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc">
  <title id="title">The family support journey at Kripa</title>
  <desc id="desc">Three vertical stages move from conversation to clarity and participation in recovery.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f2e8"/><stop offset="1" stop-color="#e9ddcb"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d1744e"/><stop offset="1" stop-color="#b85435"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#153f35" flood-opacity=".17"/></filter>
  </defs>
  <rect width="760" height="1320" rx="8" fill="url(#paper)"/>
  <path d="M0 0h760v300c-155-55-292-40-411 44C223 431 107 432 0 355Z" fill="url(#warm)"/>
  <circle cx="680" cy="60" r="195" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <text x="56" y="68" fill="#fffaf0" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4">SUPPORT FOR FAMILIES</text>
  <text x="56" y="130" fill="#fffaf0" font-family="Georgia, serif" font-size="39">Clarity begins</text><text x="56" y="178" fill="#fffaf0" font-family="Georgia, serif" font-size="39">with connection.</text>
  <text x="56" y="226" fill="#fffaf0" fill-opacity=".78" font-family="Arial, sans-serif" font-size="15">A calm, honest path when the next step is unclear.</text>
  <path d="M168 470C560 520 190 700 555 760S205 965 560 1080" fill="none" stroke="#d1744e" stroke-width="3" stroke-linecap="round"/>
  <g filter="url(#shadow)"><circle cx="168" cy="470" r="76" fill="#fffdf8"/><path d="M135 440h66a13 13 0 0 1 13 13v29a13 13 0 0 1-13 13h-30l-18 16 4-16h-22a13 13 0 0 1-13-13v-29a13 13 0 0 1 13-13Z" fill="none" stroke="#153f35" stroke-width="4"/></g>
  <text x="282" y="446" fill="#c46340" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">01 · CONVERSATION</text><text x="282" y="488" fill="#153f35" font-family="Georgia, serif" font-size="29">Talk confidentially</text><text x="282" y="522" fill="#153f35" fill-opacity=".6" font-family="Arial, sans-serif" font-size="14">Begin without needing every answer.</text>
  <g filter="url(#shadow)"><circle cx="555" cy="760" r="76" fill="#153f35"/><circle cx="555" cy="760" r="31" fill="none" stroke="#e5bd7d" stroke-width="4"/><path d="M555 730l12 27-12 34-12-34Z" fill="#e5bd7d"/></g>
  <text x="56" y="737" fill="#c46340" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">02 · CLARITY</text><text x="56" y="779" fill="#153f35" font-family="Georgia, serif" font-size="29">Understand the options</text><text x="56" y="813" fill="#153f35" fill-opacity=".6" font-family="Arial, sans-serif" font-size="14">Find the most appropriate next step.</text>
  <g filter="url(#shadow)"><circle cx="560" cy="1080" r="76" fill="#fffdf8"/><circle cx="540" cy="1080" r="25" fill="none" stroke="#153f35" stroke-width="4"/><circle cx="580" cy="1080" r="25" fill="none" stroke="#c46340" stroke-width="4"/><path d="M550 1080h20" stroke="#d7ad6d" stroke-width="5" stroke-linecap="round"/></g>
  <text x="56" y="1056" fill="#c46340" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">03 · PARTICIPATION</text><text x="56" y="1098" fill="#153f35" font-family="Georgia, serif" font-size="29">Take part in recovery</text><text x="56" y="1132" fill="#153f35" fill-opacity=".6" font-family="Arial, sans-serif" font-size="14">Help create a healthier environment.</text>
  <text x="56" y="1260" fill="#153f35" fill-opacity=".5" font-family="Arial, sans-serif" font-size="14">Family involvement is part of the recovery environment.</text>
</svg>
