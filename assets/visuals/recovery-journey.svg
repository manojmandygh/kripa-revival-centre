<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">The four stages of the Kripa recovery journey</title>
  <desc id="desc">An editorial pathway moving through treatment, therapy, awareness and planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f35"/>
      <stop offset="1" stop-color="#082a24"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c96843"/>
      <stop offset="0.5" stop-color="#e5bd7d"/>
      <stop offset="1" stop-color="#f0d49e"/>
    </linearGradient>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#fff" opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#031915" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="760" rx="8" fill="url(#bg)"/>
  <rect width="1600" height="760" rx="8" fill="url(#grain)"/>
  <circle cx="1445" cy="84" r="270" fill="none" stroke="#fff" stroke-opacity=".07"/>
  <circle cx="1445" cy="84" r="190" fill="none" stroke="#d7ad6d" stroke-opacity=".12"/>
  <circle cx="84" cy="724" r="245" fill="#c96843" opacity=".06"/>

  <text x="104" y="90" fill="#e5bd7d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="5">FOUR MONTHS · FOUR CLEAR PHASES</text>
  <text x="104" y="143" fill="#fffdf8" font-family="Georgia, serif" font-size="42">A structured path from stability to life after Kripa.</text>

  <path d="M145 555 C315 555 350 280 555 280 C750 280 760 555 980 555 C1195 555 1190 235 1435 235" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="22" stroke-linecap="round"/>
  <path d="M145 555 C315 555 350 280 555 280 C750 280 760 555 980 555 C1195 555 1190 235 1435 235" fill="none" stroke="url(#path)" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <circle cx="170" cy="555" r="64" fill="#fffaf0"/>
    <circle cx="170" cy="555" r="52" fill="none" stroke="#c96843" stroke-width="2"/>
    <path d="M145 558h50M170 533v50" stroke="#173f35" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="108" y="655" fill="#e5bd7d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">MONTH 01</text>
  <text x="108" y="690" fill="#fffdf8" font-family="Georgia, serif" font-size="30">Treatment</text>

  <g filter="url(#shadow)">
    <circle cx="555" cy="280" r="64" fill="#e5bd7d"/>
    <circle cx="555" cy="280" r="52" fill="none" stroke="#fffaf0" stroke-opacity=".65" stroke-width="2"/>
    <path d="M527 279c15-25 42-25 56 0-14 27-41 27-56 0Z" fill="none" stroke="#173f35" stroke-width="4"/>
    <circle cx="555" cy="279" r="8" fill="#173f35"/>
  </g>
  <text x="642" y="258" fill="#e5bd7d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">MONTH 02</text>
  <text x="642" y="294" fill="#fffdf8" font-family="Georgia, serif" font-size="30">Therapy</text>

  <g filter="url(#shadow)">
    <circle cx="980" cy="555" r="64" fill="#fffaf0"/>
    <circle cx="980" cy="555" r="52" fill="none" stroke="#d7ad6d" stroke-width="2"/>
    <circle cx="980" cy="555" r="23" fill="none" stroke="#173f35" stroke-width="4"/>
    <path d="M980 516v-12M980 606v-12M941 555h-12M1031 555h-12" stroke="#173f35" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="904" y="655" fill="#e5bd7d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">MONTH 03</text>
  <text x="904" y="690" fill="#fffdf8" font-family="Georgia, serif" font-size="30">Awareness</text>

  <g filter="url(#shadow)">
    <circle cx="1435" cy="235" r="64" fill="#c96843"/>
    <circle cx="1435" cy="235" r="52" fill="none" stroke="#fffaf0" stroke-opacity=".7" stroke-width="2"/>
    <path d="M1405 248l21-22 17 16 26-31" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1349" y="345" fill="#e5bd7d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">MONTH 04</text>
  <text x="1349" y="380" fill="#fffdf8" font-family="Georgia, serif" font-size="30">Planning</text>

  <text x="1425" y="704" text-anchor="end" fill="#fff" fill-opacity=".52" font-family="Arial, Helvetica, sans-serif" font-size="14">Stability · rebuilding · self-awareness · transition</text>
</svg>
