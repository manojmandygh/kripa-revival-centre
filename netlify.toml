[build]
  publish = "."

# --- Security headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"
    # Restrict executable content to this site while retaining the inline
    # presentation styles used by the static export and the contact-page map.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://formsubmit.co; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://formsubmit.co; frame-src https://www.google.com; media-src 'self'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests"
    # The site does not request device sensors, capture devices, payments or
    # geolocation. The embedded map does not require these browser APIs.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    # STAGING ONLY: keeps the test site (kriparevival.netlify.app) out of search
    # results while it is a demo. REMOVE this X-Robots-Tag line at go-live, once
    # www.kriparevivalcentre.org is set as the primary custom domain.
    X-Robots-Tag = "noindex"

# --- 301 redirects: previous site's URLs -> new structure ---
# Preserves SEO equity when the live domain migrates to this build. Verify against
# a full crawl of the old site before go-live (add any blog-post slugs found).
[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301
  force = true

